name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore src/WinFWManager/WinFWManager.csproj

      - name: Publish self-contained single exe
        run: |
          dotnet publish src/WinFWManager/WinFWManager.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -o publish/self-contained

      - name: Publish framework-dependent single exe
        run: |
          dotnet publish src/WinFWManager/WinFWManager.csproj `
            -c Release `
            -r win-x64 `
            --self-contained false `
            -p:PublishSingleFile=true `
            -o publish/framework-dependent

      - name: Prepare release assets
        run: |
          Rename-Item publish/self-contained/WinFWManager.exe "WinFWManager-${{ github.ref_name }}-standalone.exe"
          Rename-Item publish/framework-dependent/WinFWManager.exe "WinFWManager-${{ github.ref_name }}-portable.exe"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            publish/self-contained/WinFWManager-${{ github.ref_name }}-standalone.exe
            publish/framework-dependent/WinFWManager-${{ github.ref_name }}-portable.exe
          body: |
            ## Download

            | File | Description |
            |------|-------------|
            | `WinFWManager-${{ github.ref_name }}-standalone.exe` | **Recommended** — Single exe, no dependencies needed. Just download and run as Administrator. |
            | `WinFWManager-${{ github.ref_name }}-portable.exe` | Smaller download, requires [.NET 10 Desktop Runtime](https://dotnet.microsoft.com/download/dotnet/10.0) installed. |

            > ⚠️ **Note:** This app requires **Run as Administrator** to monitor network traffic and manage firewall rules.
